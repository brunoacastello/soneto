<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Soneto</title>
<meta name="description" content="Soneto: um lugar para ler e publicar poemas.">
<meta property="og:title" content="Soneto">
<meta property="og:description" content="Um lugar para ler e publicar poemas.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Soneto">
<meta property="og:locale" content="pt_BR">
<meta property="og:image" content="https://soneto.me/og/default.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9C%92%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --font:'Zilla Slab','Rockwell','Roboto Slab',Georgia,serif;
  --page-bg:#cfe3fa;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;background:var(--page-bg);scroll-padding-top:env(safe-area-inset-top,0px)}
html.snap{scroll-snap-type:y proximity}
/* celular/tablet: o feed "pula" de poema em poema, um por vez */
@media (hover:none) and (pointer:coarse){
  html.snap{scroll-snap-type:y mandatory}
  html.snap .poem{scroll-snap-stop:always}
}
body{margin:0;height:100%;background:var(--page-bg);font-family:var(--font);-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
button,input,textarea{font-family:inherit}

#app{--bg:#cfe3fa;--ink:#1b365d;--btn-bg:rgba(255,255,255,.55);min-height:100%;color:var(--ink)}
#view{min-height:100%}

/* ---------- barra superior ---------- */
#topbar{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;justify-content:space-between;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 8px;pointer-events:none;color:var(--ink)}
#topbar>*{pointer-events:auto}
#topbar::before{content:'';position:absolute;top:0;left:0;right:0;bottom:-20px;z-index:-1;pointer-events:none;
  background:linear-gradient(to bottom,var(--bar-bg,var(--bg)) 0%,var(--bar-bg,var(--bg)) 68%,transparent 100%)}
.iconbtn{width:44px;height:44px;border-radius:50%;border:0;background:var(--btn-bg);color:inherit;display:grid;place-items:center;
  cursor:pointer;text-decoration:none;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.iconbtn svg,.fab svg,.chip svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.wordmark{position:absolute;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 10px);height:44px;
  display:flex;align-items:center;font-size:1.15rem;letter-spacing:.16em;color:inherit;text-decoration:none}
.fab{position:fixed;right:18px;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);width:58px;height:58px;border-radius:50%;
  background:var(--ink);color:var(--bg);display:grid;place-items:center;z-index:20;box-shadow:0 6px 18px rgba(0,0,0,.18);text-decoration:none}
.fab svg{width:26px;height:26px;stroke-width:2.2}
.pub{border:1.5px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:999px;padding:.55rem 1.15rem;font-weight:600;font-size:.95rem;cursor:pointer}
.pub:disabled{opacity:.35;cursor:default}

/* ---------- poemas ---------- */
.poem{min-height:100svh;display:flex;align-items:center;justify-content:center;padding:5.5rem 1.4rem 6.5rem;
  background:var(--pbg);color:var(--pfg);scroll-snap-align:start}
.poem article{width:100%;max-width:27rem}
.p-title{margin:0;text-align:center;font-weight:600;font-size:1.7rem;line-height:1.2}
.p-by{display:block;text-align:center;margin-top:.35rem;font-size:1.02rem;color:inherit;opacity:.9;text-decoration:none}
.p-body{white-space:pre-wrap;margin:2rem auto 0;max-width:24rem;font-size:1.15rem;line-height:1.75;overflow-wrap:anywhere}
.p-meta{margin-top:2rem;text-align:center;font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;opacity:.7}
.p-sent{margin-top:.7rem;text-align:center;font-size:.9rem;opacity:.85}
.inl{color:inherit}
.linklike{background:none;border:0;padding:0;color:inherit;font:inherit;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.seal{width:1.05em;height:1.05em;vertical-align:-.15em;margin-left:.25rem}
.seal.big{width:1.5rem;height:1.5rem;margin-left:.4rem;vertical-align:-.2rem}
.again{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 26px);z-index:20;
  border:0;border-radius:999px;background:var(--ink);color:var(--bg);padding:.8rem 1.5rem;font-size:1rem;font-weight:600;cursor:pointer}

/* ---------- páginas simples ---------- */
.page{min-height:100%;padding:6rem 1.6rem 7rem;background:var(--bg);color:var(--ink)}
.page.narrow>*{max-width:28rem;margin-left:auto;margin-right:auto}
.kicker{margin:0 0 2rem;text-align:center;font-size:.9rem;font-weight:600;letter-spacing:.2em;text-transform:uppercase}
.sub{margin:2rem auto .2rem;max-width:28rem;font-size:.8rem;letter-spacing:.18em;text-transform:uppercase;opacity:.7}
.lead{text-align:center;font-size:1.15rem;line-height:1.5;margin-top:0}
.list{max-width:28rem;margin:0 auto}
.list a{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:1rem 0;color:inherit;text-decoration:none;font-size:1.3rem;
  border-bottom:1px solid color-mix(in srgb,var(--ink) 22%,transparent)}
.list small{font-size:.9rem;opacity:.75}
.empty{text-align:center;opacity:.8;line-height:1.5}
.loading{text-align:center;padding-top:38vh;opacity:.55;letter-spacing:.3em}
.q{display:block;width:100%;max-width:28rem;margin:0 auto 1.4rem;background:transparent;border:0;border-bottom:2px solid var(--ink);outline:0;
  color:inherit;font:inherit;font-size:1.4rem;padding:.4rem 0;border-radius:0}
textarea.q{resize:none;border:1.5px solid var(--ink);border-radius:12px;padding:.7rem;font-size:1.05rem}
.q::placeholder,.t-in::placeholder,.b-in::placeholder{color:color-mix(in srgb,var(--ink) 50%,transparent)}
.btn{display:block;width:100%;max-width:28rem;margin:1rem auto 0;padding:.85rem 1rem;border-radius:999px;border:1.5px solid var(--ink);
  background:var(--ink);color:var(--bg);font-size:1rem;font-weight:600;text-align:center;text-decoration:none;cursor:pointer}
.btn.alt{background:transparent;color:var(--ink)}
.btn:disabled{opacity:.5;cursor:default}
.err{max-width:28rem;margin:0 auto 1rem;min-height:1.3em;font-weight:600;text-align:center;line-height:1.35}
.or{text-align:center;opacity:.7;margin:1rem 0}
.switch{text-align:center;margin-top:1.4rem}
.atrow{display:flex;align-items:baseline;gap:.3rem;max-width:28rem;margin:0 auto}
.atrow span{font-size:1.4rem}
.hint{max-width:28rem;margin:-.8rem auto 1.4rem;font-size:.85rem;opacity:.75}

/* ---------- perfil e autor ---------- */
.ph{text-align:center}
.ph h1{margin:0;font-size:2.1rem;font-weight:600}
.handle{margin-top:.2rem;opacity:.85}
.bio{max-width:24rem;margin:1rem auto 0;line-height:1.5}
.count{margin-top:.8rem;font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;opacity:.7}
.swatches{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:1.2rem auto 0;max-width:22rem}
.sw{width:48px;height:48px;border-radius:12px;border:1.5px solid rgba(0,0,0,.2);font-size:1rem;font-weight:600;cursor:pointer}
.sw.on{outline:2.5px solid var(--ink);outline-offset:3px}
.pp{max-width:27rem;margin:3rem auto 0;padding-top:3rem;border-top:1px solid color-mix(in srgb,var(--ink) 25%,transparent)}
.chip{display:inline-flex;align-items:center;gap:.4rem;border:1.5px solid currentColor;border-radius:999px;padding:.4rem .9rem;background:transparent;color:inherit;
  font-weight:600;font-size:.85rem;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;text-decoration:none}
.chip svg{width:16px;height:16px}
.p-title a,.p-meta a{color:inherit;text-decoration:none}
.p-title a:hover,.p-meta a:hover{text-decoration:underline;text-underline-offset:4px}
.actions{display:flex;flex-wrap:wrap;gap:.6rem;justify-content:center;margin-top:1.8rem}
.actions .chip{font-size:.78rem;padding:.45rem .85rem}
.foot{margin-top:2.6rem;text-align:center;font-size:.85rem;opacity:.75}
.foot a{color:inherit}
.doc{max-width:38rem;margin:0 auto;line-height:1.65;font-size:1.05rem}
.doc h1{margin:0 0 .4rem;font-size:1.9rem;font-weight:600;text-align:center}
.doc h2{margin:2.2rem 0 .5rem;font-size:1.2rem;font-weight:600}
.doc p{margin:.6rem 0}
.doc .upd{text-align:center;opacity:.75;margin-bottom:1.6rem}
.doc a{color:inherit}
.mod{max-width:44rem;margin:0 auto}
.tabs{display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap;margin:1rem 0 1.6rem}
.chip.on{background:var(--ink);color:var(--bg)}
.mcard{border:1.5px solid color-mix(in srgb,var(--ink) 35%,transparent);border-radius:16px;padding:1rem 1.1rem;margin:0 0 1rem;line-height:1.5}
.mcard small,.mrow small{opacity:.75}
.mex{white-space:pre-wrap;margin:.6rem 0;opacity:.9;overflow-wrap:anywhere}
.mrow{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;padding:.9rem 0;border-bottom:1px solid color-mix(in srgb,var(--ink) 22%,transparent)}
.mactions,.roles{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.7rem}
.mrow .roles{margin-top:0}
.mactions .chip,.roles .chip{font-size:.75rem;padding:.4rem .8rem}
.ssr{max-width:34rem;margin:0 auto;padding:6rem 1.4rem;color:#1b365d;font-family:var(--font);line-height:1.6}
.ssr h1{font-size:1.7rem;text-align:center;margin:0}
.ssr p{text-align:center;margin:.4rem 0}
.ssr a{color:inherit}
.ssr-body{white-space:pre-wrap;margin-top:1.6rem}
.dotwrap{position:relative;display:inline-flex}
.dots3{width:34px;height:34px;background:transparent}
.dots3 svg{width:18px;height:18px;fill:currentColor;stroke:none}
.rowmenu{position:absolute;right:0;top:100%;z-index:30;min-width:15rem;padding:.3rem;border-radius:12px;background:var(--bg);border:1px solid color-mix(in srgb,var(--ink) 30%,transparent)}
.rowmenu button{display:block;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:.6rem .7rem;color:var(--ink);font-size:.95rem;cursor:pointer}
.rowmenu button:hover{background:color-mix(in srgb,var(--ink) 10%,transparent)}
.poem,.pp{touch-action:manipulation}
.poem.endsec{min-height:60svh}
.heartrow{text-align:center;margin-top:.9rem}
.heart{display:inline-flex;align-items:center;gap:.35rem;background:none;border:0;padding:.45rem .6rem;color:inherit;opacity:.7;cursor:pointer;font-family:inherit}
.heart svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.heart[aria-pressed="true"]{opacity:1}
.heart[aria-pressed="true"] svg{fill:currentColor}
.hc{font-size:.9rem;min-width:.6rem}
.pop{position:fixed;z-index:80;pointer-events:none;width:96px;height:96px;margin:-48px 0 0 -48px;color:#e0526a;animation:popheart .75s ease-out forwards}
.pop svg{width:100%;height:100%;fill:currentColor;stroke:none}
@keyframes popheart{0%{transform:scale(.4);opacity:0}25%{transform:scale(1.15);opacity:1}100%{transform:translateY(-24px) scale(1);opacity:0}}
.fl{display:block;max-width:28rem;margin:1.1rem auto .2rem;font-size:.8rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;opacity:.8}
.ck{max-width:28rem;margin:-.9rem auto 1rem;min-height:1.3em;font-size:.9rem;font-weight:600}
.chk{display:flex;align-items:center;gap:.7rem;max-width:28rem;margin:1.2rem auto;cursor:pointer;line-height:1.35}
.chk input{width:1.3rem;height:1.3rem;flex:none;accent-color:var(--ink)}
.warn{max-width:28rem;margin:.6rem auto;line-height:1.5}
.danger{max-width:28rem;margin:3rem auto 0;padding-top:1.5rem;border-top:1px solid color-mix(in srgb,var(--ink) 25%,transparent)}
.btn.red{background:#c62828;border-color:#c62828;color:#fff}
.ptabs{display:flex;gap:1.6rem;justify-content:center;margin-top:1.8rem}
.ptab{background:none;border:0;border-bottom:2px solid transparent;color:inherit;font:inherit;font-size:1.05rem;padding:.3rem .1rem;opacity:.6;cursor:pointer}
.ptab.on{opacity:1;font-weight:600;border-bottom-color:currentColor}
.ptab:focus-visible{outline:2px solid currentColor;outline-offset:3px}
.pwwrap{position:relative;max-width:28rem;margin:0 auto 1.4rem}
.pwwrap .q{margin:0;padding-right:2.8rem}
.eye{position:absolute;right:0;top:50%;transform:translateY(-50%);background:none;border:0;color:inherit;opacity:.75;padding:.45rem;cursor:pointer;line-height:0}
.eye svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.eye:focus-visible{outline:2px solid currentColor;outline-offset:2px;border-radius:6px}
.notice{max-width:28rem;margin:1.2rem auto 0;text-align:center;font-size:.9rem;opacity:.85}

/* ---------- criar poema ---------- */
.create{min-height:100%;padding:5.4rem 1.4rem 11rem;display:flex;flex-direction:column;align-items:center;background:var(--bg);color:var(--ink)}
.ctx{margin-bottom:.9rem;text-align:center;font-size:.95rem}
.meta{margin-top:.6rem;min-height:1.3em;font-size:.9rem;opacity:.75}
.t-in{width:100%;max-width:27rem;margin-top:1.4rem;background:transparent;border:0;outline:0;text-align:center;color:inherit;font:inherit;font-weight:600;font-size:1.7rem}
.b-in{width:100%;max-width:24rem;margin-top:1.2rem;min-height:40vh;background:transparent;border:0;outline:0;resize:none;color:inherit;font:inherit;font-size:1.15rem;line-height:1.75}
.bottombar{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);z-index:20;display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none}
.bottombar>*{pointer-events:auto}
.dots{display:flex;gap:10px;padding:10px 14px;border-radius:999px;background:var(--btn-bg);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.dot{width:26px;height:26px;border-radius:50%;border:1px solid rgba(0,0,0,.25);cursor:pointer;padding:0}
.dot.on{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ink)}
.agree{display:flex;gap:.65rem;align-items:center;max-width:90vw;padding:.6rem .95rem;border-radius:16px;background:var(--btn-bg);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);font-size:.95rem;line-height:1.3;cursor:pointer}
.agree input{width:1.3rem;height:1.3rem;flex:none;accent-color:var(--ink)}
.sheet{position:fixed;inset:0;z-index:40;overflow:auto;background:var(--bg);color:var(--ink);
  padding:calc(env(safe-area-inset-top,0px) + 4.2rem) 1.4rem calc(env(safe-area-inset-bottom,0px) + 2rem)}
.sheet .sx{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px}
.opt{display:block;width:100%;max-width:28rem;margin:0 auto;padding:1.05rem .5rem;background:none;border:0;color:inherit;text-align:center;cursor:pointer;
  border-bottom:1px solid color-mix(in srgb,var(--ink) 22%,transparent)}
.opt strong{display:block;font-size:1.1rem;letter-spacing:.08em;text-transform:uppercase}
.opt span{display:block;margin-top:.3rem;font-size:.95rem;line-height:1.4;opacity:.85}
.opt.on strong{text-decoration:underline;text-underline-offset:4px}

/* ---------- menu ---------- */
#scrim{position:fixed;inset:0;z-index:50;pointer-events:none}
.menu-open #scrim{pointer-events:auto}
#menu{position:fixed;z-index:60;top:calc(env(safe-area-inset-top,0px) + 62px);left:12px;min-width:168px;padding:.35rem;border-radius:18px;
  background:color-mix(in srgb,var(--m-bg,#cfe3fa) 90%,var(--m-ink,#1b365d));color:var(--m-ink,#1b365d);
  box-shadow:0 4px 16px rgba(0,0,0,.07);opacity:0;transform:translateY(-6px);pointer-events:none;transition:opacity .18s ease,transform .18s ease}
.menu-open #menu{opacity:1;transform:none;pointer-events:auto}
#menu a{display:block;padding:.6rem 1rem;border-radius:12px;color:inherit;text-decoration:none;font-size:1.05rem;letter-spacing:.03em}
#menu a.small{font-size:.85rem;opacity:.75;margin-top:.2rem}
#menu a:active{background:color-mix(in srgb,var(--m-ink,#1b365d) 10%,transparent)}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 100px);z-index:70;max-width:86vw;
  background:#1b365d;color:#fff;border-radius:14px;padding:.7rem 1rem;font-size:.95rem;text-align:center;opacity:0;pointer-events:none;transition:opacity .25s}
#toast.show{opacity:1}
</style>
</head>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(() => {
'use strict';

/* ================= configuração ================= */
const SUPABASE_URL = 'https://prmhbjubcdbxnuxxaxgy.supabase.co';
const SUPABASE_KEY = 'sb_publishable_86pn0hWnXJOlUslDUDb2_w_YA5vPQud'; // chave pública: pode ficar no código
const CONTACT_EMAIL = ''; // coloque aqui o e-mail de contato (aparece nos Termos de uso)
const GOOGLE_ENABLED = false; // mude para true depois de configurar o login com Google no Supabase

if (!window.supabase) {
  document.body.innerHTML = '<p style="font-family:Georgia,serif;text-align:center;padding:30vh 1.5rem 0">Não consegui carregar o Soneto. Verifique sua conexão e recarregue a página.</p>';
  return;
}
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: { flowType: 'pkce', detectSessionInUrl: true, persistSession: true, autoRefreshToken: true }

/* ================= dados fixos ================= */
const COMBOS = [

  {id:'manteiga', name:'Manteiga',     bg:'#fff1a8', fg:'#5b4200'},

];
const POEM_COLORS = COMBOS.slice(0, 7);

const FORMS = [
  {id:'livre',     name:'Versos livres', n:null, desc:'Sem número fixo de versos nem métrica. Liberdade total.'},
  {id:'monostico', name:'Monóstico',     n:1,    desc:'Um único verso.'},

const RESERVED = new Set(['soneto','admin','suporte','entrar','novo','explorar','aleatorio','procurar','autor','autores','voce','eu']);

/* ================= utilidades ================= */
const $ = id => document.getElementById(id);

    pts.push((i ? 'L' : 'M') + (r * Math.cos(t)).toFixed(2) + ' ' + (r * Math.sin(t)).toFixed(2));
  }
  return pts.join('') + 'Z';
})();

async function hydrateLikes(root) {
  if (!session || !root) return;
  const btns = [...root.querySelectorAll('.heart[data-id]')];
  if (!btns.length) return;
  const ids = [...new Set(btns.map(b => b.dataset.id))];
  const ownIds = [...new Set(btns.filter(b => b.dataset.own === '1').map(b => b.dataset.id))];
  try {
    const [fav, cnt] = await Promise.all([
      sb.from('favorites').select('poem_id').in('poem_id', ids),
      ownIds.length ? sb.rpc('my_like_counts', { p_poem_ids: ownIds }) : Promise.resolve({ data: [] })
    ]);
    const liked = new Set((fav.data || []).map(r => r.poem_id));
    const counts = new Map((cnt.data || []).map(r => [r.poem_id, Number(r.likes)]));
    btns.forEach(b => {
      b.setAttribute('aria-pressed', liked.has(b.dataset.id) ? 'true' : 'false');
      if (b.dataset.own === '1') b.querySelector('.hc').textContent = String(counts.get(b.dataset.id) || 0);
    });
  } catch (e) { console.error(e); }
}

async function toggleLike(btn, onlyLike) {
  if (!session || !me) { pending = curPath(); toast('Entre para favoritar poemas.'); go('/entrar'); return; }
  const id = btn.dataset.id;
  const liked = btn.getAttribute('aria-pressed') === 'true';
  if (onlyLike && liked) return;
  const hc = btn.querySelector('.hc');
  const own = btn.dataset.own === '1';
  const setState = on => {
    btn.setAttribute('aria-pressed', on ? 'true' : 'false');
    if (own && hc) hc.textContent = String(Math.max(0, (Number(hc.textContent) || 0) + (on ? 1 : -1)));
  };
  setState(!liked);
  const r = liked
    ? await sb.from('favorites').delete().eq('poem_id', id).eq('user_id', me.id)
    : await sb.from('favorites').insert({ user_id: me.id, poem_id: id });
  if (r.error && r.error.code !== '23505') {
    setState(liked);
    fail('Não consegui favoritar agora. Tente de novo.', r.error);
  }
}

const FEED_PAGE = 5;
let feedState = null, feedObserver = null;

async function fetchFeedPage(st) {
  const { data: ids, error } = await sb.rpc('feed_page', { p_seed: st.seed, p_offset: st.offset, p_limit: FEED_PAGE, p_form: st.form });
  if (error) throw error;
  st.offset += ids.length;
  if (ids.length < FEED_PAGE) st.done = true;
  if (!ids.length) return [];
  const rows = await fetchPoems(q => q.in('id', ids));
  const pos = new Map(ids.map((x, i) => [x, i]));
  rows.sort((a, b) => pos.get(a.id) - pos.get(b.id));
  return rows.filter(p => { if (st.shown.has(p.id)) return false; st.shown.add(p.id); return true; });
}
function appendFeed(list) {
  const box = $('feedList');
  if (!box || !list.length) return;
  box.insertAdjacentHTML('beforeend', list.map(p => sectionHTML(p)).join(''));
  feedState.last = list[list.length - 1];
  hydrateLikes(box);
}
function showFeedEnd() {
  const end = $('feedEnd');
  if (!end || !feedState) return;
  const c = comboOf(feedState.last ? feedState.last.color : 'azul');
  end.innerHTML = `<section class="poem endsec" style="--pbg:${c.bg};--pfg:${c.fg}"><article>`
    + '<div class="p-meta" style="margin-top:0">Isso é tudo por enquanto</div>'
    + '<div class="actions"><button class="chip" data-act="reshuffle">Ver em outra ordem</button></div>'
    + '</article></section>';
}
function watchFeedEnd() {
  if (feedObserver) feedObserver.disconnect();
  const end = $('feedEnd');
  if (!end) return;
  const st = feedState;
  feedObserver = new IntersectionObserver(async entries => {
    if (!entries.some(e => e.isIntersecting) || st !== feedState || st.loading) return;
    if (st.done) { showFeedEnd(); feedObserver.disconnect(); return; }
    st.loading = true;
    try {
      const list = await fetchFeedPage(st);
      if (st === feedState) appendFeed(list);
    } catch (e) { console.error(e); }
    st.loading = false;
    if (st !== feedState) return;
    if (st.done) { showFeedEnd(); feedObserver.disconnect(); }
    else { feedObserver.unobserve(end); feedObserver.observe(end); }
  }, { rootMargin: '700px 0px' });
  feedObserver.observe(end);
}

    + '<div id="res"></div></div>';

function poemRow(p, words) {
  const by = p.author ? p.author.name : (p.owner ? (p.owner.display_name || '@' + p.owner.username) : '');
  const lines = p.body.split('\n');
  const line = (lines.find(l => words.some(w => norm(l).includes(w))) || lines[0] || '').trim();
  const snip = line.length > 90 ? line.slice(0, 90) + '...' : line;
  return `<a href="/p/${enc(p.short_id || p.id)}"><span>${esc(p.title || 'Sem título')}<br><small>${esc(by)}${by ? ' · ' : ''}${esc(snip)}</small></span></a>`;
}
async function runSearch(q) {
  const tok = ++searchTok;
  const raw = q.trim().replace(/^@/, '');
  let authors = [], people = [], found = [];
  const words = norm(raw).replace(/[^a-z0-9\s]/g, ' ').split(/\s+/).filter(w => w.length >= 3).slice(0, 5);
  try {
    authors = (await getAuthors()).filter(a => !raw || norm(a.name).includes(norm(raw)));
    const safe = raw.replace(/[%,()*\\"'.:]/g, ' ').trim();
    if (safe) {
      const { data } = await sb.from('profiles').select('username,display_name,badge')
        .not('display_name', 'is', null)
        .or(`username.ilike.*${safe}*,display_name.ilike.*${safe}*`).limit(20);
      people = data || [];
    }
    if (words.length) {
      let pq = sb.from('poems').select(SEL);
      for (const w of words) pq = pq.ilike('search_text', '*' + w + '*');
      const r = await pq.order('created_at', { ascending: false }).limit(20);
      if (r.error) console.error(r.error); else found = r.data || [];
    }
  } catch (e) { console.error(e); }
  if (tok !== searchTok || !$('res')) return;
  let html = '';
  if (authors.length) html += '<h2 class="sub">Autores</h2><div class="list">' + authorRows(authors) + '</div>';
  if (people.length) html += '<h2 class="sub">Pessoas</h2><div class="list">'
    + people.map(u => `<a href="/u/${enc(u.username)}"><span>${esc(u.display_name)}${u.badge === 'oficial' ? seal('oficial') : ''}<br><small>@${esc(u.username)}</small></span></a>`).join('') + '</div>';
  if (found.length) html += '<h2 class="sub">Poemas</h2><div class="list">' + found.map(p => poemRow(p, words)).join('') + '</div>';
  $('res').innerHTML = html || '<p class="empty">Nada encontrado.</p>';
}

async function loadProfileFavorites(offset, replace) {
  const box = $('profBody');
  if (!box) return;
  const uname = profCache.username;
  try {
    const { data: ids, error } = await sb.rpc('user_favorite_ids', { p_username: uname, p_limit: 20, p_offset: offset });
    if (error) throw error;
    const rows = ids.length ? await fetchPoems(q => q.in('id', ids)) : [];
    const pos = new Map(ids.map((x, i) => [x, i]));
    rows.sort((a, b) => pos.get(a.id) - pos.get(b.id));
    const html = rows.map(p => `<div class="pp">${articleHTML(p, {byline:true})}</div>`).join('');
    const more = ids.length === 20 ? '<p class="morewrap" style="text-align:center;margin-top:2rem"><button class="chip" data-act="prof-more">Ver mais</button></p>' : '';
    box.querySelectorAll('.morewrap').forEach(m => m.remove());
    if (replace) {
      const note = (me && me.username === uname && me.favorites_public === false) ? '<p class="empty" style="margin-top:2rem">Só você vê esta lista.</p>' : '';
      box.innerHTML = note + (html || '<p class="empty" style="margin-top:3rem">Nenhum favorito ainda.</p>') + more;
    } else {
      box.insertAdjacentHTML('beforeend', html + more);
    }
    profCache.favOffset = offset + ids.length;
    hydrateLikes(box);
  } catch (e) {
    console.error(e);
    box.innerHTML = '<p class="empty">Não consegui carregar os favoritos.</p>';
  }
}

function trErr(e) {
  const m = String(e && e.message || '').toLowerCase();
  if (m.includes('invalid login')) return 'E-mail ou senha incorretos.';
  if (m.includes('already registered') || m.includes('already been registered')) return 'Esse e-mail já tem conta. Tente entrar.';
  if (m.includes('password should be') || m.includes('weak')) return 'A senha é fraca demais. Use pelo menos 8 caracteres, com letras e números.';
  if (m.includes('valid email') || m.includes('invalid email')) return 'Esse e-mail não parece válido.';
  if (m.includes('rate limit')) return 'Muitas tentativas. Espere um pouco e tente de novo.';
  if (m.includes('not confirmed')) return 'Confirme seu e-mail antes de entrar.';
  return 'Algo deu errado. Tente de novo.';
}
function setErr(t) { const e = $('err'); if (e) e.textContent = t || ''; }

async function doAuth() {
  const email = $('em').value.trim(), pw = $('pw').value;
  const pw2 = $('pw2') ? $('pw2').value : null;
  setErr('');
  if (!email || !pw) return setErr('Preencha o e-mail e a senha.');
  if (authMode === 'signup' && pw2 !== null && pw !== pw2) return setErr('As duas senhas não são iguais.');
  if (authMode === 'signup' && (pw.length < 8 || !/[a-zA-Z]/.test(pw) || !/[0-9]/.test(pw))) return setErr('A senha é fraca demais. Use pelo menos 8 caracteres, com letras e números.');
  const btn = $('goBtn'); btn.disabled = true;
  try {
    const r = authMode === 'signup'
      ? await sb.auth.signUp({ email, password: pw })
      : await sb.auth.signInWithPassword({ email, password: pw });
    if (r.error) { setErr(trErr(r.error)); return; }
    if (!r.data.session) { setErr('Enviamos um e-mail de confirmação. Confirme e depois entre.'); return; }
    session = r.data.session;
    await loadMe();
    if (me && me.display_name) { const d = pending || '/'; pending = null; go(d); }
    else go('/bem-vindo');
  } catch (e) { console.error(e); setErr('Algo deu errado. Tente de novo.'); }
  finally { if ($('goBtn')) $('goBtn').disabled = false; }
}
async function doGoogle() {
  try { sessionStorage.setItem('soneto_pending', pending || ''); } catch (e) {}
  const { error } = await sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: location.origin + '/' } });

}

  if (error) {

    const m = String(error.message || '').toLowerCase(), c = String(error.code || '');

    if (c === 'same_password' || m.includes('different') || m.includes('same')) return setErr('Escolha uma senha diferente da anterior.');

      return setErr('O link venceu. Peça um novo link em Esqueci a senha e tente de novo.');

/* ---------- verificar se o @ esta disponivel ---------- */
const unCheck = { timer: null, tok: 0 };
async function checkUsername(v) {
  v = (v || '').trim();
  if (!/^[a-z0-9_]{3,30}$/.test(v)) return { ok: false, msg: 'Use de 3 a 30 letras minúsculas, números ou _.' };
  if (v.startsWith('poeta_') || RESERVED.has(v)) return { ok: false, msg: 'Esse @ não está disponível.' };
  if (me && v === me.username) return { ok: true, msg: 'Este é o seu @ atual.' };
  const { data, error } = await sb.from('profiles').select('id').eq('username', v).maybeSingle();
  if (error) { console.error(error); return { ok: false, msg: 'Não consegui verificar agora. Tente de novo.' }; }
  return data ? { ok: false, msg: 'Esse @ já está em uso.' } : { ok: true, msg: 'Disponível.' };
}
function scheduleUserCheck(inp) {
  clearTimeout(unCheck.timer);
  const msg = $('unMsg');
  if (!msg) return;
  const v = inp.value.trim();
  if (!v) { msg.textContent = ''; return; }
  msg.textContent = 'Verificando...';
  const tok = ++unCheck.tok;
  unCheck.timer = setTimeout(async () => {
    const r = await checkUsername(v);
    if (tok !== unCheck.tok || !$('unMsg')) return;
    $('unMsg').textContent = (r.ok ? '✓ ' : '✕ ') + r.msg;
  }, 350);
}

async function storyBlob(p) {
  const W = 1080, H = 1920, PADX = 110, MAXW = W - PADX * 2, TOP = 250, BOTTOM = 250;
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const g = cv.getContext('2d');
  const col = comboOf(p.color);
  try { await Promise.all([document.fonts.load('400 40px "Zilla Slab"'), document.fonts.load('600 40px "Zilla Slab"')]); } catch (e) {}
  const fam = '"Zilla Slab", Georgia, serif';
  g.fillStyle = col.bg; g.fillRect(0, 0, W, H);
  g.fillStyle = col.fg; g.textBaseline = 'top';

  const wrap = (text, font) => {
    g.font = font;
    const out = []; let line = '';
    for (const w of text.split(/\s+/)) {
      const t = line ? line + ' ' + w : w;
      if (!line || g.measureText(t).width <= MAXW) line = t; else { out.push(line); line = w; }
    }
    if (line) out.push(line);
    return out;
  };
  const by = p.author ? p.author.name : (p.owner ? (p.owner.display_name || '@' + p.owner.username) : '');
  const avail = H - TOP - BOTTOM;
  let size = 50, layout = null;
  const build = s => {
    const tSize = Math.round(s * 1.35);
    const titleLines = p.title ? wrap(p.title, `600 ${tSize}px ${fam}`) : [];
    const lines = [];
    for (const raw of p.body.split('\n')) {
      if (!raw.trim()) lines.push(null); else wrap(raw.trim(), `400 ${s}px ${fam}`).forEach(l => lines.push(l));
    }
    const headH = (titleLines.length ? titleLines.length * tSize * 1.25 : 0) + (by ? s * 1.1 : 0) + (titleLines.length || by ? s * 1.6 : 0);
    const bodyH = lines.reduce((acc, l) => acc + (l === null ? s * 0.9 : s * 1.5), 0);
    return { s, tSize, titleLines, lines, headH, bodyH, total: headH + bodyH };
  };
  for (; size >= 26; size -= 2) { layout = build(size); if (layout.total <= avail) break; }
  if (layout.total > avail) {
    while (layout.total > avail && layout.lines.length > 4) {
      layout.lines.pop();
      layout.bodyH = layout.lines.reduce((acc, l) => acc + (l === null ? layout.s * 0.9 : layout.s * 1.5), 0);
      layout.total = layout.headH + layout.bodyH;
    }
    while (layout.lines.length && layout.lines[layout.lines.length - 1] === null) layout.lines.pop();
    layout.lines.push('...');
  }
  let y = TOP + Math.max(0, (avail - layout.total) / 2);
  g.textAlign = 'center';
  if (layout.titleLines.length) {
    g.font = `600 ${layout.tSize}px ${fam}`;
    for (const l of layout.titleLines) { g.fillText(l, W / 2, y); y += layout.tSize * 1.25; }
  }
  if (by) { g.font = `400 ${layout.s}px ${fam}`; g.fillText('por ' + by, W / 2, y + layout.s * 0.1); y += layout.s * 1.1; }
  if (layout.titleLines.length || by) y += layout.s * 1.6;
  g.font = `400 ${layout.s}px ${fam}`;
  let blockW = 0;
  for (const l of layout.lines) if (l) blockW = Math.max(blockW, g.measureText(l).width);
  const x0 = (W - blockW) / 2;
  g.textAlign = 'left';
  for (const l of layout.lines) {
    if (l === null) { y += layout.s * 0.9; continue; }
    g.fillText(l, x0, y); y += layout.s * 1.5;
  }
  g.textAlign = 'center'; g.font = `400 44px ${fam}`;
  try { g.letterSpacing = '10px'; } catch (e) {}
  g.fillText('soneto.me', W / 2, H - 170);
  return new Promise(res => cv.toBlob(res, 'image/png'));
}
async function doShareImage(p) {
  toast('Preparando a imagem...');
  let blob;
  try { blob = await storyBlob(p); } catch (e) { return fail('Não consegui gerar a imagem.', e); }
  if (!blob) return fail('Não consegui gerar a imagem.', 'sem imagem');
  const file = new File([blob], 'soneto-poema.png', { type: 'image/png' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: shareText(p) }); return; }
    catch (e) { if (e && e.name === 'AbortError') return; console.error(e); }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'soneto-poema.png';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast('Imagem salva. Agora é só postar nos stories.');
}

    const limit = String(error.message || '').includes('limite diario');
    fail(limit ? 'Você chegou ao limite de 10 poemas por dia. Volte amanhã.' : 'Não consegui publicar. Tente de novo.', error);
    updateMeta();
    return;
  }
  const dest = createAuthor ? '/a/' + enc(createAuthor.slug) : '/u/' + enc(me.username);
  draft = newDraft();
  toast('Poema publicado.');
  go(dest);
}

/* ---------- denunciar autoria ---------- */
function openReport(poemId) {
  if (!session) { pending = curPath(); go('/entrar'); return; }
  closeReport();
  const o = document.createElement('div');
  o.className = 'sheet'; o.id = 'reportSheet';
  o.innerHTML = `<button class="iconbtn sx" data-act="report-close" aria-label="Fechar">${ICON.x}</button>
    <h2 class="kicker">Denunciar</h2>
    <p class="lead">Algo está errado com este poema? Conte o que aconteceu.</p>
    <textarea class="q" id="rsn" rows="4" maxlength="500" placeholder="Por exemplo: este poema é de outra pessoa, tem conteúdo ofensivo ou é spam."></textarea>
    <div class="err" id="rErr"></div>
    <button class="btn" id="rBtn" data-act="report-send" data-id="${esc(poemId)}">Enviar denúncia</button>
    <button class="btn alt" data-act="report-close">Cancelar</button>`;
  app.appendChild(o);
}
function closeReport() { const o = $('reportSheet'); if (o) o.remove(); }
async function sendReport(poemId) {
  const reason = $('rsn').value.trim();
  if (reason.length < 3) { $('rErr').textContent = 'Escreva ao menos uma frase curta.'; return; }
  $('rBtn').disabled = true;
  const { error } = await sb.from('reports').insert({ poem_id: poemId, reporter_id: me.id, reason });
  if (error) {
    $('rBtn').disabled = false;
    $('rErr').textContent = error.code === '23505' ? 'Você já denunciou este poema.' : 'Não consegui enviar. Tente de novo.';
    if (error.code !== '23505') console.error(error);
    return;
  }
  closeReport();
  toast('Denúncia enviada. Obrigado.');
}

/* ================= menu ================= */
function menuColors() {
  let bg = app.style.getPropertyValue('--bg'), fg = app.style.getPropertyValue('--ink');
  const sec = [...document.querySelectorAll('.poem')].find(el => {
    const r = el.getBoundingClientRect();
    return r.top <= window.innerHeight / 2 && r.bottom >= window.innerHeight / 2;
  });
  if (sec) { bg = sec.style.getPropertyValue('--pbg'); fg = sec.style.getPropertyValue('--pfg'); }
  const m = $('menu');
  m.style.setProperty('--m-bg', bg);
  m.style.setProperty('--m-ink', fg);
}

/* ================= rotas ================= */
async function route() {
  const id = ++navId;
  if (feedObserver) feedObserver.disconnect();
  feedState = null;
  document.title = 'Soneto';
  document.body.classList.remove('menu-open');
  closeReport();
  const parts = location.pathname.replace(/^\/+|\/+$/g, '').split('/').map(dec);
  const a = parts[0], b = parts[1];
  window.scrollTo(0, 0);

  if ((a === 'novo' || a === 'editar' || a === 'moderar' || a === 'perfil' || a === 'bem-vindo') && !session) { pending = curPath(); go('/entrar'); return; }
  if (session && me && !me.display_name && a !== 'bem-vindo') { go('/bem-vindo'); return; }
  if (session && a === 'entrar') { go('/'); return; }

  document.documentElement.classList.toggle('snap', a === '' || a === 'forma');
  switch (a) {
    case 'forma':      return viewFeed(id, b);
    case 'explorar':   return viewExplore(id);
    case 'aleatorio':  return viewRandom(id);
    case 'procurar':   return viewSearch();
    case 'u':          return viewProfile(id, b);
    case 'a':          return viewAuthor(id, b);
    case 'novo':       return viewCreate(id, b);
    case 'editar':     return viewCreate(id, '', b);
    case 'p':          return viewPoem(id, b);
    case 'termos':     return viewTerms();
    case 'sobre':      return viewAbout();
    case 'esqueci-a-senha': return viewForgot();
    case 'nova-senha': return viewNewPassword(id);
    case 'perfil':     return viewSettings(id);
    case 'moderar':    return viewMod(id);
    case 'entrar':     return viewAuth();
    case 'bem-vindo':  return viewOnboard();
    default:           return viewFeed(id);
  }
}

/* ================= eventos ================= */
document.addEventListener('click', async e => {
  if (!e.target.closest('.dotwrap')) document.querySelectorAll('.rowmenu').forEach(m => { m.hidden = true; });
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  switch (act) {
    case 'menu-toggle':
      if (document.body.classList.contains('menu-open')) document.body.classList.remove('menu-open');
      else { menuColors(); const mm = $('menuMod'); if (mm) mm.hidden = !isStaff(); document.body.classList.add('menu-open'); }
      break;
    case 'menu-close': document.body.classList.remove('menu-open'); break;
    case 'retry': route(); break;
    case 'another': viewRandom(navId); break;

    case 'auth-switch': authMode = authMode === 'login' ? 'signup' : 'login'; viewAuth(); break;
    case 'auth-submit': doAuth(); break;
    case 'google': doGoogle(); break;
    case 'onboard': doOnboard(); break;
    case 'logout':
      await sb.auth.signOut();
      session = null; me = null; palOpen = false;
      toast('Você saiu da conta.');
      go('/');
      break;

    case 'toggle-pal': palOpen = !palOpen; viewProfile(navId, me.username, true); break;
    case 'pick-combo': {
      const { error } = await sb.from('profiles').update({ theme: id }).eq('id', me.id);
      if (error) { fail('Não consegui salvar a cor. Rodou o SQL do perfil?', error); break; }
      me.theme = id;
      viewProfile(navId, me.username, true);
      break;
    }

    case 'close-create': go(editing ? '/p/' + enc(editing.short_id || editing.id) : (createAuthor ? '/a/' + enc(createAuthor.slug) : '/')); break;
    case 'form-open': $('sheet').innerHTML = sheetHTML(); $('sheet').hidden = false; break;
    case 'sheet-close': $('sheet').hidden = true; break;
    case 'form-pick': draft.mode = id; $('sheet').hidden = true; updateMeta(); break;
    case 'color-pick':
      draft.color = id; theme(comboOf(id));
      document.querySelectorAll('.dot').forEach(d => d.classList.toggle('on', d.dataset.id === id));
      break;
    case 'publish': publish(); break;

    case 'report': openReport(id); break;
    case 'report-close': closeReport(); break;
    case 'report-send': sendReport(id); break;

    case 'share':     if (currentPoem && currentPoem.id === id) doShare(currentPoem); break;
    case 'share-img': if (currentPoem && currentPoem.id === id) doShareImage(currentPoem); break;
    case 'copy-link': toast((await copyText(poemURL(currentPoem && currentPoem.id === id ? currentPoem : id))) ? 'Link copiado.' : 'Não consegui copiar o link.'); break;

    case 'mod-tab': modTab = id; renderModTabs(); loadModTab(); break;
    case 'mod-toggle-resolved': modResolved = !modResolved; loadModTab(); break;
    case 'mod-resolve': {
      const { error } = await sb.rpc('mod_resolve_report', { p_report_id: id });
      if (error) { fail(modErr(error), error); break; }
      toast('Denúncia marcada como resolvida.');
      loadModTab();
      break;
    }
    case 'mod-del': {
      if (!confirm('Apagar este poema da plataforma? Isso não pode ser desfeito.')) break;
      const { error } = await sb.rpc('mod_delete_poem', { p_poem_id: id });
      if (error) { fail(modErr(error), error); break; }
      toast('Poema apagado.');
      if (location.pathname.startsWith('/p/')) go('/');
      else if (location.pathname === '/moderar') loadModTab();
      else route();
      break;
    }
    case 'toggle-pw': {
      const inp = $(el.dataset.target);
      if (!inp) break;
      const show = inp.type === 'password';
      inp.type = show ? 'text' : 'password';
      el.setAttribute('aria-pressed', show ? 'true' : 'false');
      el.setAttribute('aria-label', show ? 'Ocultar senha' : 'Mostrar senha');
      el.innerHTML = show ? ICON.eyeOff : ICON.eye;
      break;
    }
    case 'like': await toggleLike(el); break;
    case 'reshuffle': window.scrollTo(0, 0); viewFeed(navId, feedState ? feedState.form : null); break;
    case 'prof-tab': {
      const box = $('profBody');
      if (!box) break;
      document.querySelectorAll('[data-act="prof-tab"]').forEach(b => b.classList.toggle('on', b.dataset.tab === el.dataset.tab));
      if (el.dataset.tab === 'poemas') { box.innerHTML = profCache.poemsHTML; hydrateLikes(box); break; }
      box.innerHTML = '<p class="loading" style="padding-top:3rem">· · ·</p>';
      await loadProfileFavorites(0, true);
      break;
    }
    case 'prof-more': await loadProfileFavorites(profCache.favOffset, false); break;
    case 'save-profile': await saveProfile(); break;
    case 'del-open': $('delBox').hidden = false; $('delOpen').hidden = true; break;
    case 'del-cancel': $('delBox').hidden = true; $('delOpen').hidden = false; $('delErr').textContent = ''; break;
    case 'del-confirm': await deleteAccount(); break;
    case 'forgot-send': await sendReset(); break;
    case 'newpw-save': await saveNewPassword(); break;
    case 'mod-menu': {
      const m = $('rm-' + id);
      const open = m && m.hidden;
      document.querySelectorAll('.rowmenu').forEach(x => { x.hidden = true; });
      if (m && open) m.hidden = false;
      break;
    }
    case 'mod-badge': {
      const badge = el.dataset.badge === 'none' ? null : el.dataset.badge;
      const msg = badge ? 'Dar o selo de autor oficial a esta conta?' : 'Remover o selo de autor oficial desta conta?';
      if (!confirm(msg)) break;
      const { error } = await sb.rpc('admin_set_badge', { p_user_id: id, p_badge: badge });
      if (error) { fail(modErr(error), error); break; }
      toast(badge ? 'Selo de autor oficial concedido.' : 'Selo removido.');
      if (me && id === me.id) await loadMe();
      loadModTab();
      break;
    }
    case 'mod-role': {
      const role = el.dataset.role;
      if (!confirm('Mudar o papel desta conta para ' + ROLES[role] + '?')) break;
      const { error } = await sb.rpc('admin_set_role', { p_user_id: id, p_role: role });
      if (error) { fail(modErr(error), error); break; }
      toast('Papel atualizado.');
      if (me && id === me.id) { await loadMe(); route(); break; }
      loadModTab();
      break;
    }

    case 'del': {
      if (!confirm('Apagar este poema? Isso não pode ser desfeito.')) break;
      const { error } = await sb.from('poems').delete().eq('id', id);
      if (error) { fail('Não consegui apagar.', error); break; }
      toast('Poema apagado.');
      if (location.pathname.startsWith('/p/')) go('/'); else route();
      break;
    }
  }
});

document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'q') { clearTimeout(searchTimer); const v = t.value; searchTimer = setTimeout(() => runSearch(v), 250); }
  else if (t.id === 'mq') { clearTimeout(modTimer); const v = t.value; modTimer = setTimeout(async () => { try { const h = await modAccountsList(v); if ($('accList')) $('accList').innerHTML = h; } catch (err) { console.error(err); } }, 250); }
  else if (t.id === 'tIn') draft.title = t.value;
  else if (t.id === 'bIn') { draft.body = t.value; grow(t); updateMeta(); }
  else if (t.id === 'un' || t.id === 'su') { const v = t.value.toLowerCase().replace(/[^a-z0-9_]/g, ''); if (v !== t.value) t.value = v; scheduleUserCheck(t); }
});
document.addEventListener('change', e => {
  if (e.target.id === 'agree') { draft.agree = e.target.checked; updateMeta(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    document.body.classList.remove('menu-open');
    const s = $('sheet'); if (s) s.hidden = true;
    closeReport();
  } else if (e.key === 'Enter' && (e.target.id === 'em' || e.target.id === 'pw' || e.target.id === 'pw2')) { e.preventDefault(); doAuth(); }
  else if (e.key === 'Enter' && (e.target.id === 'dn' || e.target.id === 'un' || e.target.id === 'bio')) { e.preventDefault(); doOnboard(); }
  else if (e.key === 'Enter' && (e.target.id === 'sn' || e.target.id === 'su' || e.target.id === 'sb')) { e.preventDefault(); saveProfile(); }
  else if (e.key === 'Enter' && (e.target.id === 'delPw' || e.target.id === 'delWord')) { e.preventDefault(); deleteAccount(); }
  else if (e.key === 'Enter' && e.target.id === 'fe') { e.preventDefault(); sendReset(); }
  else if (e.key === 'Enter' && (e.target.id === 'np1' || e.target.id === 'np2')) { e.preventDefault(); saveNewPassword(); }
});

sb.auth.onAuthStateChange((_evt, s) => { session = s; if (!s) me = null; });
const curPath = () => location.pathname + location.search;
function go(path, replace) {
  if (path === curPath()) { route(); return; }
  history[replace ? 'replaceState' : 'pushState'](null, '', path);
  route();
}
window.addEventListener('popstate', route);
let lastTap = { t: 0, x: 0, y: 0 };
document.addEventListener('pointerup', e => {
  if (e.pointerType !== 'touch') return;
  const art = e.target.closest('.poem article, .pp article');
  if (!art || e.target.closest('a, button, input, textarea, label')) return;
  const now = Date.now();
  if (now - lastTap.t < 320 && Math.hypot(e.clientX - lastTap.x, e.clientY - lastTap.y) < 40) {
    lastTap.t = 0;
    const btn = art.querySelector('.heart');
    if (btn) {
      if (session && me) popHeart(e.clientX, e.clientY);
      toggleLike(btn, true);
    }
  } else {
    lastTap = { t: now, x: e.clientX, y: e.clientY };
  }
});

document.addEventListener('click', e => {
  if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
  const a = e.target.closest('a[href]');
  if (!a || a.target === '_blank' || a.hasAttribute('download')) return;
  const href = a.getAttribute('href');
  if (!href || href[0] !== '/' || href.startsWith('//')) return;
  e.preventDefault();
  document.body.classList.remove('menu-open');
  go(href);
});

/* ================= início ================= */
(async () => {
  try {
    const { data } = await sb.auth.getSession();
    session = data.session;
    if (session) await loadMe();
  } catch (e) { console.error(e); }
  if (location.search.includes('code=')) history.replaceState(null, '', location.pathname);
  try {
    const p = sessionStorage.getItem('soneto_pending');
    if (p) { sessionStorage.removeItem('soneto_pending'); if (session) pending = p; }
  } catch (e) {}
  if (session && me && me.display_name && pending) { history.replaceState(null, '', pending); pending = null; }
  if (location.hash.startsWith('#/')) history.replaceState(null, '', location.hash.slice(1));
  route();
})();
})();
</script>
